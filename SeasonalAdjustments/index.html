<!DOCTYPE html><html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>TIPS Seasonality — A Visual Guide</title>
<style>
  :root{
    --bg:#0f172a; --panel:#1e293b; --ink:#e2e8f0; --muted:#94a3b8;
    --grid:#334155; --settle:#38bdf8; --mat:#f59e0b;
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.45 -apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif;display:flex;flex-direction:column}
  svg{width:100%;height:100%;display:block}

  #topbar{display:flex;align-items:center;gap:10px;padding:9px 16px;border-bottom:1px solid var(--grid);flex:0 0 auto}
  .portal-link{font-size:11px;font-weight:700;color:var(--muted);background:var(--panel);border:1px solid var(--grid);border-radius:4px;padding:4px 10px;text-decoration:none;letter-spacing:.02em}
  .portal-link:hover{background:var(--ink);color:#0f172a;border-color:var(--ink)}
  #tocBtn{background:#0b1220;border:1px solid var(--grid);color:var(--ink);padding:6px 12px;border-radius:6px;cursor:pointer;font-size:13px}
  #tocBtn:hover{border-color:var(--settle)}
  #bookTitle{font-size:14px;font-weight:700;letter-spacing:.02em}
  #crumb{margin-left:auto;color:var(--muted);font-size:12px}

  #tocScrim{position:fixed;inset:0;background:rgba(0,0,0,.5);opacity:0;pointer-events:none;transition:opacity .15s;z-index:20}
  #toc.open #tocScrim{opacity:1;pointer-events:auto}
  #tocPanel{position:fixed;top:0;left:0;bottom:0;width:min(360px,88vw);background:var(--panel);border-right:1px solid var(--grid);transform:translateX(-100%);transition:transform .18s;z-index:21;padding:18px 16px;overflow-y:auto}
  #toc.open #tocPanel{transform:translateX(0)}
  #tocPanel h3{margin:0 0 14px;font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
  .toc-pages{list-style:none;margin:0;padding:0}
  .toc-pages li{padding:8px 0 8px 14px;color:var(--muted);font-size:13px;cursor:pointer;border-left:2px solid var(--grid)}
  .toc-pages li:hover{color:var(--ink)}
  .toc-pages li.on{color:var(--settle);border-left-color:var(--settle);font-weight:600}

  #stage{flex:1 1 auto;overflow-y:auto;display:flex;flex-direction:column;min-height:0}
  .page{display:none;flex:1;flex-direction:column;padding:12px 22px 4px;min-height:0}
  .page.on{display:flex}
  .pageTitle{text-align:center;font-size:24px;font-weight:800;margin:2px 0 8px;letter-spacing:.01em}
  .hero{flex:1 1 auto;min-height:320px;display:flex;align-items:center;justify-content:center}

  #pagerbar{display:flex;align-items:center;gap:14px;padding:8px 22px;border-top:1px solid var(--grid);flex:0 0 auto}
  #pagerbar button{background:#0b1220;border:1px solid var(--grid);color:var(--ink);padding:7px 16px;border-radius:8px;cursor:pointer;font-size:13px;font-weight:600}
  #pagerbar button:hover:not(:disabled){border-color:var(--settle)}
  #pagerbar button:disabled{opacity:.3;cursor:default}
  #dots{flex:1;display:flex;justify-content:center;gap:6px}
  #dots span{width:7px;height:7px;border-radius:50%;background:var(--grid);cursor:pointer}
  #dots span.on{background:var(--settle)}
  .src{color:var(--muted);font-size:11px;text-align:center;padding:2px 22px 6px}
</style>
</head>
<body>

<header id="topbar">
  <a href="../" class="portal-link">&#8592; Portal</a>
  <button id="tocBtn">&#9776; Contents</button>
  <div id="bookTitle">TIPS Seasonality</div>
  <div id="crumb"></div>
</header>

<nav id="toc">
  <div id="tocScrim"></div>
  <div id="tocPanel"><h3>Contents</h3><ul class="toc-pages" id="tocList"></ul></div>
</nav>

<div id="stage"></div>

<div id="pagerbar">
  <button id="prevBtn">&#8249; Prev</button>
  <div id="dots"></div>
  <button id="nextBtn">Next &#8250;</button>
</div>
<div class="src" id="src">Loading…</div>

<script type="module">
import { loadSnapshot, SNAP, SNAPSHOT_LABEL } from './src/snap-data.js';
import { drawS1, drawS2, drawS3 } from './src/snap-slides.js';

// Slide registry — grows one entry per slide as the rework proceeds.
const PAGES = [
  { title: 'The Sawtooth', draw: drawS1, vh: 520 },
  { title: 'Why the Month Matters', draw: drawS2, vh: 520 },
  { title: 'Near and Far', draw: drawS3, vh: 520 },
];

const stage = document.getElementById('stage');
PAGES.forEach((pg, i) => {
  const div = document.createElement('div');
  div.className = 'page'; div.id = 'page' + i;
  div.innerHTML = `<h2 class="pageTitle">${pg.title}</h2>` +
    `<div class="hero"><svg id="svg${i}" viewBox="0 0 900 ${pg.vh || 520}" preserveAspectRatio="xMidYMid meet"></svg></div>`;
  stage.appendChild(div);
});

const tocList = document.getElementById('tocList');
tocList.innerHTML = PAGES.map((pg, i) => `<li data-page="${i}">${i + 1}. ${pg.title}</li>`).join('');

const dotsEl = document.getElementById('dots');
PAGES.forEach((_, i) => {
  const d = document.createElement('span');
  d.addEventListener('click', () => showPage(i));
  dotsEl.appendChild(d);
});

let curPage = 0;
function showPage(i) {
  curPage = Math.max(0, Math.min(PAGES.length - 1, i));
  const pg = PAGES[curPage];
  document.querySelectorAll('.page').forEach((el, idx) => el.classList.toggle('on', idx === curPage));
  document.getElementById('crumb').textContent = (curPage + 1) + ' / ' + PAGES.length;
  document.querySelectorAll('#toc [data-page]').forEach(el => el.classList.toggle('on', +el.dataset.page === curPage));
  document.querySelectorAll('#dots span').forEach((el, idx) => el.classList.toggle('on', idx === curPage));
  document.getElementById('prevBtn').disabled = curPage === 0;
  document.getElementById('nextBtn').disabled = curPage === PAGES.length - 1;
  closeToc();
  redraw();
}
function redraw() { PAGES[curPage].draw(document.getElementById('svg' + curPage)); }

function openToc() { document.getElementById('toc').classList.add('open'); }
function closeToc() { document.getElementById('toc').classList.remove('open'); }
document.getElementById('tocBtn').addEventListener('click', openToc);
document.getElementById('tocScrim').addEventListener('click', closeToc);
document.querySelectorAll('#toc [data-page]').forEach(el => el.addEventListener('click', () => showPage(+el.dataset.page)));
document.getElementById('prevBtn').addEventListener('click', () => showPage(curPage - 1));
document.getElementById('nextBtn').addEventListener('click', () => showPage(curPage + 1));
document.addEventListener('keydown', e => {
  if (document.getElementById('toc').classList.contains('open')) { if (e.key === 'Escape') closeToc(); return; }
  if (e.key === 'ArrowRight') showPage(curPage + 1);
  else if (e.key === 'ArrowLeft') showPage(curPage - 1);
});

(async function () {
  try {
    await loadSnapshot();
    document.getElementById('src').textContent =
      `Frozen snapshot — market quotes as of ${SNAPSHOT_LABEL}, ${SNAP.bonds.length} outstanding TIPS.`;
  } catch (e) {
    document.getElementById('src').textContent = 'Snapshot data failed to load: ' + e.message;
  }
  showPage(0);
})();
</script>
</body>
</html>
